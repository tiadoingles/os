  <script>
    // Tema do OS = design do Craft Green (o mesmo da aba Financeiro; tokens em financeiro/comum.js > FIN).
    // Os nomes semânticos ficam (brand/bg/ink...) para todas as telas mudarem juntas.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: "#064e3b", dark: "#022c22", light: "#ecfdf5" }, // emerald-900 / 950 / 50
            bg: "#f5f7f6",        // fundo das telas (Craft)
            sidebar: "#07110e",   // menu lateral escuro (Craft)
            card: "#ffffff",
            line: "#e2e8f0",      // bordas (slate-200)
            ink: "#0F172A",       // texto principal (slate-900)
            muted: "#64748b",     // texto secundário (slate-500)
            tinta: "#07110e",     // títulos, cards escuros, aba ativa
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          borderRadius: { card: "1.35rem", painel: "1.6rem", modal: "2.5rem" },
          boxShadow: {
            card: "0 16px 40px -35px rgba(3,15,10,.6)",
            painel: "0 20px 55px -42px rgba(3,15,10,.5)",
            botao: "0 18px 38px -18px rgba(6,78,59,.75)",
            modal: "0 32px 80px -20px rgba(0,0,0,.15)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="./styles.css?v=84" />
